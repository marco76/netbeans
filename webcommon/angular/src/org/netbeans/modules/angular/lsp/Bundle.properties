Diagnostic.element.cause=Angular cannot match an element to an HTML element or an available component/directive.
Diagnostic.element.guidance=Check the selector spelling first. For a standalone component, import the matching standalone declaration or its exporting NgModule in the consuming component. For an NgModule component, check the declaring module imports and the dependency module exports. Custom elements require their own setup; do not hide an unknown Angular component with a schema.
Diagnostic.binding.cause=Angular cannot resolve a property binding to a native property or an input of an available component/directive.
Diagnostic.binding.guidance=Check the property/input spelling and whether the directive is in template scope. For example, ngModel needs FormsModule in the consuming standalone component or declaring NgModule. An import only helps when it provides the intended directive; it cannot fix a misspelled input.
Diagnostic.pipe.cause=The template references a pipe that Angular cannot find in its compilation scope.
Diagnostic.pipe.guidance=Check the pipe name. Import a standalone pipe or its exporting NgModule in the consuming component, or import that module in the declaring NgModule. A TypeScript import alone does not put a pipe in template scope.
Diagnostic.result=The template dependency or binding should become resolvable after a correct change. The Angular language server checks the result again. Any selected action below is supplied by that server; inspect its title before applying it.

Diagnostic.member.cause=The template refers to a property or method that is not available on the component or the expression's receiver.
Diagnostic.member.guidance=Check spelling and template variable scope first. If the member belongs on the component, use the language server's create-property or create-method action when offered, then choose its correct type and implementation. A nested object member must be fixed on that object's type; adding a component property will not fix it.
