Learning.title=Understand these options
Learning.toggle=Show or hide explanations of the selected Angular options.
Learning.version=Angular CLI: {0}. Examples describe concepts; generation follows the installed CLI and workspace defaults.
Learning.unknown=Version unknown
Learning.default=Workspace default: the CLI reads schematic settings from angular.json. An omitted option does not force a particular value.
Learning.component=Generated files: the TypeScript class holds behavior, HTML displays data, styles control appearance, and a .spec.ts file tests behavior when tests are enabled. File names follow your installed CLI.
Learning.template=HTML template: {0}. Separate files suit larger views; inline templates keep small components together. Example: <h2>'{{' title '}}'</h2> displays the class property title.
Learning.styles=Styles: {0}; format: {1}. Separate styles suit larger components; inline styles suit short rules. CSS works directly; SCSS/Sass and Less add preprocessing. Example CSS: h2 '{' color: navy; '}'. Selecting none omits component styles.
Learning.tests=Unit tests: {0}. Generate a starting test to check component creation, then test visible behavior. Example: set an input, run change detection, and assert the rendered text. Skip omits the generated test; it does not disable existing tests.
Learning.standalone=Component type: {0}. Standalone components declare template dependencies in their own imports. NgModule components are declared in a module, whose imports supply template dependencies. Prefer the existing project convention. Example: a standalone template using a pipe imports that pipe.
Learning.legacy=This CLI predates Angular 14: standalone generation is unavailable. Components use NgModule declarations.
Learning.detection=Change detection: {0}. OnPush allows Angular to skip subtrees until notified, for example by a new input value or an event. Replace input objects instead of mutating them. Example: this.user = '{' ...this.user, name: "Ada" '}'. Workspace default leaves the strategy to the CLI configuration.
Learning.signals=Signals (Angular 16+): signal() stores reactive state; computed() derives a value. Example: count = signal(0); doubled = computed(() => this.count() * 2). A signal read in an OnPush template notifies Angular when it changes. Inputs receive data from a parent; outputs report events to it. Example: a user-card receives a user input and emits a selected event. These are concepts to use after generation; this wizard does not add signals, inputs, or outputs.
Learning.layout=File layout: {0}. A subfolder groups the component files; same folder places them directly in the chosen destination. Preview Files shows the CLI dry run before writing files.
Learning.project=The application is generated as standalone with strict checks. Standalone components manage their own template imports; strict checks catch type and template mistakes earlier. Example: a binding to a missing class property can be reported during compilation.
Learning.routing=Routing: {0}. Use routing for views with distinct URLs. Example: a /users route renders a users component inside a router outlet.
Learning.ssr=Server-side rendering: {0}. SSR produces initial HTML on the server; browser APIs must run in a browser context. Example: guard access to window. Leave SSR off for an application that only needs client rendering.
Learning.projectStyles=Stylesheet format: {0}. CSS is a direct starting point; SCSS/Sass and Less add variables and other preprocessing features. Example CSS: h2 '{' color: navy; '}'. Component styles and global application styles serve different scopes.
Learning.material=Angular Material: {0}; theme: {1}. Material adds UI components and theme setup using a matching Angular major version. Example: import MatButtonModule before using a Material button. A theme supplies shared colors and typography; CLI default uses that Material version''s default. Material requires dependency installation.
Learning.install=Install dependencies: {0}. npm installs the packages needed to build and run the application. If skipped, run npm install in the generated folder before serving it.
Learning.enabled=Enabled
Learning.disabled=Disabled

Learning.classRole=The TypeScript class holds component state and behavior. Its @Component metadata connects it to its template and styles. The selector names the element a parent template uses. Add properties and methods here; template bindings read them.
Learning.templateRole=The HTML template describes the view. Interpolation displays class properties, property bindings pass values, and event bindings call methods. Example: <button (click)="save()">Save</button> calls the component method. An inline template lives in @Component; templateUrl points to a separate HTML file.
Learning.styleRole=Component styles control this view. The @Component styles, styleUrl, or styleUrls metadata connects the stylesheet to the component. Example: h2 '{' color: navy; '}'. Under default emulated encapsulation, rules are scoped to this component; global styles belong in the application stylesheet. Inline styles live in the TypeScript file.
Learning.testRole=The .spec.ts file tests the component. TestBed configures the test environment and a fixture lets a test interact with the component and its rendered view. A generated creation test is a starting point: add a test that changes data, runs change detection, and checks the displayed result. Use the workspace test command to run it.
