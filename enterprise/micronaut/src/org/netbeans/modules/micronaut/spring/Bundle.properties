AnnotationExplain.title=Explain unresolved Spring annotation...
AnnotationExplain.docs=Official Spring documentation
AnnotationExplain.details=Cause:\nJava cannot resolve the recognized Spring annotation {0} at this location.\n\nWhat to inspect or change:\n{1}\n\nExpected result:\nAfter the annotation type is available and correctly imported, Java can resolve it and check its use. This does not by itself register a bean: component scanning, configuration, and runtime dependencies still matter.
AnnotationExplain.import=The annotation type is available to the Java compiler. Inspect its import and spelling. Use the existing Java import quick fix for this exact qualified name if the simple name is intended. Check for conflicting imports or a different annotation with the same simple name.
AnnotationExplain.dependency=The expected annotation type is not currently resolvable. Check the project dependency and its scope, dependency download errors, and the IDE project reload. In Spring Boot, prefer a suitable starter using the project managed versions. A Java import alone cannot supply a missing library. No dependency or version is selected automatically.
