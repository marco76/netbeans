nb.preferred.color.profile=FlatLaf Light

# Shared surface hierarchy: white documents, warm chrome, restrained blue focus.
@background=#F7F7F5
@foreground=#283343
@componentBackground=#FFFFFF
@buttonBackground=#FFFFFF
@menuBackground=#FFFFFF
@accentBaseColor=#356AC3
@disabledForeground=#818894
Component.borderColor=#DCDfE4
Component.separatorColor=#E4E6EA
Component.focusedBorderColor=$Component.linkColor
Label.disabledForeground=@disabledForeground

ToolBar.background=@background
MenuBar.background=@background
Button.toolbar.hoverBackground=#E9EDF3
Button.toolbar.pressedBackground=#DBE4F1
ToggleButton.toolbar.selectedBackground=#DFE8F6
TableHeader.background=#F2F3F4
Table.gridColor=#ECEEF1
ToolTip.background=#FFFFFF
ToolTip.foreground=@foreground

#---- EditorView ----

Nb.EmptyEditorArea.background=#F0F1F3


#---- EditorTab ----

EditorTab.background=$Nb.EmptyEditorArea.background
EditorTab.foreground=#626D7C
EditorTab.activeBackground=$EditorTab.background
EditorTab.activeForeground=$EditorTab.foreground
EditorTab.selectedBackground=@componentBackground
EditorTab.selectedForeground=@foreground
# Add the hover effect only for unselected tabs.
EditorTab.hoverBackground=#E5EAF1
EditorTab.selectedHoverBackground=$EditorTab.selectedBackground
EditorTab.hoverForeground=@foreground
EditorTab.attentionBackground=#E6C840
EditorTab.attentionForeground=#000
EditorTab.underlineColor=$TabbedPane.underlineColor
EditorTab.inactiveUnderlineColor=mix($TabbedPane.underlineColor, @background, 45%)

#---- ViewTab ----

ViewTab.background=@background
ViewTab.foreground=mix(@foreground, @background, 75%)
ViewTab.activeBackground=$ViewTab.background
ViewTab.activeForeground=$ViewTab.foreground
ViewTab.selectedBackground=$Tree.background
ViewTab.selectedForeground=$EditorTab.selectedForeground
ViewTab.hoverBackground=mix($TabbedPane.underlineColor, @background, 9%)
ViewTab.selectedHoverBackground=$Tree.background
ViewTab.hoverForeground=$EditorTab.hoverForeground
ViewTab.attentionBackground=$EditorTab.attentionBackground
ViewTab.attentionForeground=$EditorTab.attentionForeground
ViewTab.underlineColor=$EditorTab.underlineColor
ViewTab.inactiveUnderlineColor=$EditorTab.inactiveUnderlineColor

#---- Explorer ----

Tree.background=#FBFBFA
Tree.foreground=mix(@foreground, @background, 92%)
Tree.selectionBackground=mix($TabbedPane.underlineColor, $Tree.background, 16%)
Tree.selectionForeground=$Tree.foreground
Tree.selectionInactiveBackground=mix($TabbedPane.underlineColor, $Tree.background, 9%)
Tree.selectionInactiveForeground=$Tree.foreground
Tree.icon.collapsedColor=mix($Tree.foreground, $Tree.background, 55%)
Tree.icon.expandedColor=$Tree.icon.collapsedColor

#---- Tab Dragging ----

Panel.dropTargetGlassPane=shade($EditorTab.underlineColor, 20%)

#---- SlidingButton ----

SlidingButton.hoverBackground=$ViewTab.hoverBackground
SlidingButton.selectedBackground=darken($SlidingButton.hoverBackground,10%)
SlidingButton.attentionBackground=$ViewTab.attentionBackground
SlidingButton.attentionForeground=$ViewTab.attentionForeground


#---- PropSheet ----

PropSheet.setBackground=#F0F1F3
PropSheet.setForeground=@foreground

# Start Page
nb.startpage.topbar.background=darken($TabbedPane.focusColor, 25%)
nb.startpage.tab.border1.color=$nb.startpage.topbar.background
nb.startpage.tab.border2.color=$nb.startpage.topbar.background

# QuickSearch
nb.quicksearch.border=1,1,1,1,@background

# output
nb.output.selectionBackground=#89BCED
nb.output.warning.foreground=#946200
nb.output.background=@componentBackground
nb.output.foreground=@foreground
