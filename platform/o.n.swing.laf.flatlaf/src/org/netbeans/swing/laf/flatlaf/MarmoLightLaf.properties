nb.preferred.color.profile=Marmo Light

# Neutral light workspace, with white documents and blue focus accents.
@background=#F2F2F2
@foreground=#242424
@componentBackground=#FFFFFF
@buttonBackground=#FFFFFF
@menuBackground=#FFFFFF
@accentColor=#3574F0
@accentBaseColor=#3574F0
@disabledForeground=#8C8C8C
Component.borderColor=#D1D1D1
Component.separatorColor=#DEDEDE
Component.focusedBorderColor=#3574F0
ToolBar.background=@background
MenuBar.background=@background
Tree.background=#F7F8FA
Tree.foreground=@foreground
Tree.selectionBackground=#D4E2FF
Tree.selectionForeground=@foreground
Tree.selectionInactiveBackground=#E4E7ED
Tree.selectionInactiveForeground=@foreground
Nb.EmptyEditorArea.background=#EBECF0
EditorTab.background=#EBECF0
EditorTab.activeBackground=#EBECF0
EditorTab.foreground=#616161
EditorTab.activeForeground=#616161
EditorTab.selectedBackground=#FFFFFF
EditorTab.selectedForeground=@foreground
EditorTab.hoverBackground=#DFE3EB
EditorTab.selectedHoverBackground=#FFFFFF
EditorTab.underlineColor=#3574F0
ViewTab.background=@background
ViewTab.selectedBackground=#F7F8FA
ViewTab.selectedForeground=@foreground
ViewTab.underlineColor=#3574F0
TableHeader.background=#F2F2F2
Table.gridColor=#EBECF0
ToolTip.background=#FFFFFF
ToolTip.foreground=@foreground
nb.output.background=#FFFFFF
nb.output.foreground=@foreground
nb.output.selectionBackground=#A6D2FF
nb.output.warning.foreground=#946200

# Clear gutter focus and restrained breakpoint markers.
NbEditorGlyphGutter.activeLineForeground=#3574F0
NbEditorGlyphGutter.breakpointColor=#D1495B
