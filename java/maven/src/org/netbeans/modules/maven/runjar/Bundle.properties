BootExplain.title=Why does Spring Boot need an application class?
BootExplain.docs=Official Spring Boot documentation
BootExplain.details=Cause:\nThis run action needs an application main class and the current configuration did not provide a resolved value. An unresolved start-class property or multiple entry points can require a choice.\n\nSuggested change:\nChoose the application class containing public static void main(String[] args), typically the class annotated with @SpringBootApplication that calls SpringApplication.run. Choose session-only for a temporary selection, or permanent to save the active NetBeans action mapping. The POM is not edited by this chooser.\n\nExpected result:\nNetBeans supplies the selected class to this run action. Selecting a class does not fix compilation, dependency, or runtime configuration errors. If no class is listed, inspect source roots and Java compilation errors first.
